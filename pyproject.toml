[project]
name = "dna-promoter-transformer"
version = "0.1.0"
description = "A conv+transformer classifier for DNA promoter recognition, on E. coli and human sequences."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "genomic-benchmarks>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["genomic_benchmarks.*"]
ignore_missing_imports = true
